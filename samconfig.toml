# Modified by smalvy, 2026 — adapted for portfolio-project-2
# More information about the configuration file can be found here:
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html
version = 0.1

[default.global.parameters]
stack_name = "portfolio-project-2"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"


# LocalStack deploy
[localstack.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = false
s3_bucket = "awssamcli-managed-default"
s3_prefix = "portfolio-project-2"
region = "us-east-1"
stack_name = "portfolio-project-2"


# AWS deploy
[aws.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
region = "" # set the region of your choice inside AWS
profile = "" # set the profile name that contains credentials to connect to AWS through the CLI
stack_name = "portfolio-project-2"
